[package]
name = "loadtest"
version = "0.1.0"
edition = "2024"
description = "HTTP load testing tool"
license = "Apache-2.0"
repository = "https://github.com/bonnetn/loadtest"
readme = "README.md"
keywords = ["load-test", "http", "benchmark"]
categories = ["development-tools::testing"]

[build-dependencies]
prost-build = "0.14"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
prost = "0.14"
http = "1.5.0"
url = "2"
miette = { version = "7.6.0", features = ["fancy", "derive"] }
thiserror = "2"
compio = { version = "0.19.1", default-features = false, features = ["io-uring", "runtime", "macros", "fs", "net", "io", "time", "signal", "bytes", "rustls"] }
cyper = { version = "0.9.0", default-features = false, features = ["rustls", "http2", "stream"] }
async-channel = "2.5.0"
libc = "0.2.189"
futures = "0.3.34"
chrono = "0.4.45"
rust_decimal = "1.43.0"
rand = { version = "0.9.5", features = ["small_rng"] }
rand_distr = "0.5.1"
bytes = "1.12.1"
console = "0.16.6"

[dev-dependencies]
assert_cmd = "=2.2.2"
predicates = "=3.1.4"
