[package]
name = "loadtest"
version = "0.1.0"
edition = "2024"
description = "HTTP load testing tool"
license = "Apache-2.0"
repository = "https://github.com/bonnetn/loadtest"
readme = "README.md"
keywords = ["load-test", "http", "benchmark"]
categories = ["development-tools::testing"]

[build-dependencies]
prost-build = "0.14.6"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
prost = "0.14.6"
http = "1.5.0"
url = "2.5.9"
miette = { version = "7.6.0", features = ["fancy", "derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["http2", "default-tls", "stream", "rustls"] }
time = { version = "0.3.45", features = ["formatting", "macros"] }
rust_decimal = "1.43.0"
bytes = "1.12.2"
console = "0.16.6"
rustls-native-certs = "0.8.5"

[dev-dependencies]
assert_cmd = "=2.2.2"
predicates = "=3.1.4"
